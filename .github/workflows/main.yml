name: Build and Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Tests (with coverage thresholds)
        run: npm run test:coverage

  # Missing translations (usually done already by the Translate workflow
  # when en.json changed on main): one runner per locale, committed to main
  translate:
    name: Translate
    needs: quality
    uses: ./.github/workflows/translate.yml
    with:
      ref: main

  version:
    name: Sync version
    runs-on: ubuntu-latest
    needs: translate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every locale has every key
        working-directory: AI translate
        run: |
          MISSING=$(python missing_locales.py)
          if [ -n "$MISSING" ]; then
            echo "::error::Locales still missing keys of en.json: $MISSING"
            exit 1
          fi

      - name: Sync manifest.json and package versions with tag
        run: |
          TAG="${{ github.ref_name }}"
          CURRENT=$(jq -r '.version' manifest.json)
          if [ "$CURRENT" != "$TAG" ]; then
            echo "Updating manifest.json: $CURRENT → $TAG"
            jq --arg v "$TAG" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          else
            echo "manifest.json already at $TAG"
          fi
          jq --arg v "$TAG" '.version = $v' package.json > package.tmp && mv package.tmp package.json
          jq --arg v "$TAG" '.version = $v | .packages[""].version = $v' package-lock.json > package-lock.tmp && mv package-lock.tmp package-lock.json

      - name: Commit versions to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json
          git diff --staged --quiet && echo "Nothing to commit" || (
            git commit -m "chore: release ${{ github.ref_name }} — sync versions"
            git push origin HEAD:main
          )

  build:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < main.js)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          LIMIT=2097152
          echo "Bundle size: ${SIZE_MB} MB"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "❌ Bundle size ${SIZE_MB} MB exceeds 2 MB limit"
            exit 1
          fi
          echo "✅ Bundle size OK (${SIZE_MB} MB)"

      - name: Create release files
        run: |
          mkdir -p release
          cp main.js release/
          cp styles.css release/
          cp manifest.json release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/main.js
            release/styles.css
            release/manifest.json
          generate_release_notes: true
          draft: false
          fail_on_unmatched: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 15
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
