name: Build and Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (with coverage thresholds)
        run: npm run test:coverage

  # The release is built from the tagged commit as it is, so that commit must
  # already carry the version (the /release skill bumps it before tagging) and
  # every translation. Nothing is committed back to main here.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Tag matches manifest.json version
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Releases run on a X.Y.Z tag, not on ${{ github.ref }}"
            exit 1
          fi
          TAG="${{ github.ref_name }}"
          MANIFEST=$(jq -r '.version' manifest.json)
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::manifest.json version is $MANIFEST but the tag is $TAG. Bump manifest.json in a commit and tag that commit (use /release)."
            exit 1
          fi
          echo "manifest.json version matches tag $TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every locale has every key
        working-directory: AI translate
        run: |
          MISSING=$(python missing_locales.py)
          if [ -n "$MISSING" ]; then
            echo "::error::Locales still missing keys of en.json: $MISSING. Let the Translate workflow finish on main, then tag again."
            exit 1
          fi

  build:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [quality, verify]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(wc -c < main.js)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          LIMIT=2097152
          echo "Bundle size: ${SIZE_MB} MB"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "❌ Bundle size ${SIZE_MB} MB exceeds 2 MB limit"
            exit 1
          fi
          echo "✅ Bundle size OK (${SIZE_MB} MB)"

      - name: Create release files
        run: |
          mkdir -p release
          cp main.js release/
          cp styles.css release/
          cp manifest.json release/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/styles.css
            release/manifest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/styles.css
            release/manifest.json
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 15
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
